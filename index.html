<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мій семестр</title>
<meta name="description" content="Розклад пар, цілі, звички, події та оцінки на семестр. Працює без інтернету, дані зберігаються лише на твоєму пристрої.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Семестр">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single mobile-first column, sticky date header, agenda rows with a mono time rail, bottom tab bar */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --ink:#131c33; --muted:#5a6479; --line:#d2d9e4;
  --accent:#2445c4; --accent-ink:#ffffff; --now:#d9930c; --now-soft:#fff3d6;
  --chys:#2445c4; --znam:#0d806b; --rose:#c23a5f; --violet:#6a4ec4;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#151c2d; --surface-2:#1d2538; --ink:#e7ebf3; --muted:#97a2b9; --line:#29324a;
  --accent:#8199ff; --accent-ink:#0d1220; --now:#f2b53a; --now-soft:#2e2510;
  --chys:#8199ff; --znam:#3ec5a6; --rose:#f0809e; --violet:#a994ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2d; --surface-2:#1d2538; --ink:#e7ebf3; --muted:#97a2b9; --line:#29324a;
  --accent:#8199ff; --accent-ink:#0d1220; --now:#f2b53a; --now-soft:#2e2510;
  --chys:#8199ff; --znam:#3ec5a6; --rose:#f0809e; --violet:#a994ff; color-scheme:dark}

/* standalone safety: the file must also work when opened directly, without the artifact wrapper */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
.wk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap;border:1.5px solid currentColor;background:transparent}
.wk.chys{color:var(--chys)} .wk.znam{color:var(--znam)} .wk.off{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.2}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,50,.14)}
@media (max-width:440px){.seg{grid-template-columns:1fr 1fr}}
.wk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

main{display:flex;flex-direction:column;gap:22px;padding-top:18px}
h2{font-family:var(--font-display);font-weight:500;font-size:14px;letter-spacing:.02em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}

/* hero */
.hero{background:var(--surface);border-radius:var(--r);padding:10px 14px;border:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.hero>.subj,.hero>.meta,.hero>.bar{grid-column:1/-1}
.hero.live{border-color:var(--now);box-shadow:0 0 0 3px var(--now-soft)}
.hero .state{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero.live .state{color:var(--now)}
.hero .subj{font-family:var(--font-display);font-size:16px;font-weight:500;line-height:1.2}
.hero .meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .count{font-family:var(--font-mono);font-size:12px;color:var(--muted);grid-row:1;grid-column:2;text-align:right}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--now);border-radius:6px}

/* agenda */
.agenda{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.time{font-family:var(--font-mono);font-size:12.5px;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--ink)}
.time span{display:block;color:var(--muted)}
.body{min-width:0}
.title{font-weight:600;line-height:1.3}
.sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.chip.mod{background:color-mix(in srgb,var(--rose) 16%,transparent);color:var(--rose)}
.chip.dl{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.chip.per{background:color-mix(in srgb,var(--znam) 16%,transparent);color:var(--znam)}
.chip.skip{background:transparent;border:1px dashed var(--muted)}
.row.skipped .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.row.skipped .time{color:var(--muted)}
.row.nowrow{background:var(--now-soft)}
.pairno{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:2px}
.empty{padding:16px;color:var(--muted);font-size:14px;text-align:left}

.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--gc,var(--accent));background:transparent;display:grid;place-items:center;padding:0;flex:none}
.check.on{background:var(--gc,var(--accent))}
.check.on::after{content:"";width:9px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .title{text-decoration:line-through;color:var(--muted)}

/* goals */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.goal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal-head .t{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.goal .gbar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.goal .gbar>i{display:block;height:100%;background:var(--gc);border-radius:8px;transition:width .3s}
.goal .stats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.goal .stats b{color:var(--gc);font-family:var(--font-mono)}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:center;padding:6px 0}
.step .st{flex:1;min-width:0;overflow-wrap:anywhere}
.step .sd{font-size:12px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap}
.step.done .st{text-decoration:line-through;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:10px}
.wgoals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.wgoal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;width:100%;background:none;border:0;padding:11px 0;text-align:left;color:inherit;font:inherit}
.wgoal+.wgoal{border-top:1px solid var(--line)}
.wgoal .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgoal b{font-family:var(--font-mono);font-size:13px;color:var(--gc)}
.wgoal .gbar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.wgoal .gbar>i{display:block;height:100%;background:var(--gc);border-radius:6px;transition:width .3s}
.mini-goal{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.mini-goal .gbar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.mini-goal .gbar>i{display:block;height:100%;background:var(--gc)}
.mini-goal b{font-family:var(--font-mono);font-size:13px;color:var(--gc)}

/* profile menu */
.menu-row{padding-block:15px}
.menu-meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{font-size:20px;line-height:1;color:var(--muted)}
.subhead{display:flex;align-items:center}

/* schedule in profile */
.sub-h{font-family:var(--font-display);font-weight:500;font-size:13.5px;margin:24px 0 10px}
.plist{display:flex;flex-direction:column;gap:14px}
.title.muted{color:var(--muted)}

/* template */
.onboard{background:var(--surface);border:1.5px dashed var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.onboard b{font-family:var(--font-display);font-weight:500;font-size:16px}
.onboard span{color:var(--muted);font-size:14px}
.ptimes{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.ptimes .pn{font-family:var(--font-mono);font-size:13px;color:var(--muted);width:16px}
.ptimes input{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}

/* profile */
.namebox{display:flex;align-items:center;gap:12px;width:100%;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:17px;flex:none}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.name-input{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.2;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;background:transparent;padding:2px 0 4px;width:100%;min-width:0;color:var(--ink)}
.name-input:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.name-input::placeholder{color:var(--muted);font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.25;display:block;margin-top:4px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:180px}
.col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%}
.col .track{position:relative;width:100%;max-width:30px;flex:1;min-height:0}
.col .bp{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.col .bd{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:var(--accent)}
.col .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);height:14px;font-variant-numeric:tabular-nums}
.col .d{font-size:11px;color:var(--muted);font-weight:600}
.col.today .d{color:var(--now)}
.grow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;align-items:center}
.grow:first-child{border-top:0}
.ach-act{display:flex;gap:6px;align-items:center}
.grade{font-family:var(--font-mono);font-size:15px;font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.grade .sub{display:inline;font-size:12px}
.ects{display:inline-block;min-width:24px;text-align:center;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:1px}
.ects.A,.ects.B{background:color-mix(in srgb,var(--znam) 18%,transparent);color:var(--znam)}
.ects.C,.ects.D,.ects.E{background:color-mix(in srgb,var(--now) 22%,transparent);color:var(--now)}
.ects.FX,.ects.F{background:color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.glist{display:flex;flex-direction:column;margin-bottom:16px}
.gitem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.avg-row{background:var(--surface-2)}
.avg-row .title{font-family:var(--font-display);font-weight:500}
.scale{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;font-variant-numeric:tabular-nums}

/* queue */
.qsec{display:flex;flex-direction:column;gap:12px}
.qsec h2{margin:0}
.goal.queued{border-style:dashed}
.qnote{font-size:13px;font-weight:600;color:var(--gc,var(--accent))}
.cb{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.cb input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--accent)}

/* auto-shift switch */
.shift{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.shift+.shift{border-top:0;padding-top:0}
.ctime{display:none}
form:has(select[name=pair] option[value="0"]:checked) .ctime{display:grid}
.seg.seg2{grid-template-columns:repeat(2,1fr)}
.seg button small{font-weight:500;opacity:.75;margin-left:4px;font-family:var(--font-mono)}
.kind-seg{grid-template-columns:repeat(2,1fr)}
.kind-seg label{position:relative;display:block}
.kind-seg input{position:absolute;opacity:0;inset:0}
.kind-seg span{display:block;text-align:center;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.kind-seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,50,.14)}
.kind-seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
form:has(input[name=gkind][value=habit]:checked) .only-steps{display:none}
form:has(input[name=gkind][value=steps]:checked) .only-habit{display:none}
.only-steps,.only-habit{display:flex;flex-direction:column;gap:12px}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dpick label{position:relative}
.dpick input{position:absolute;opacity:0;inset:0}
.dpick span{display:block;text-align:center;padding:9px 0;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.dpick input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.dpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.hab-sched{font-size:13px;color:var(--muted)}
.hab-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hab-day{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px 0;font-size:11px;font-weight:600;color:var(--muted)}
.hab-day i{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--muted)}
.hab-day.on i{border-color:var(--gc)}
.hab-day.done i{background:var(--gc);border-color:var(--gc)}
.hab-day.done i::after{content:"";width:9px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.hab-day.miss i{border-style:dashed}
.hab-day.off i{border-color:transparent;background:var(--surface-2)}
.hab-day.today{color:var(--ink)}
.hab-day[disabled]{opacity:.55}
.hab-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hab-stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.hab-stats b{display:block;font-family:var(--font-mono);font-size:18px;color:var(--gc)}
.hab-stats span{display:block;font-size:12px;color:var(--muted)}
.wgoal .title small{font-weight:400;color:var(--muted)}
.switch{width:42px;height:25px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;padding:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--gc,var(--accent));border-color:var(--gc,var(--accent))}
.switch[aria-checked="true"]::after{transform:translateX(17px);background:var(--surface)}

/* buttons */
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.icon-btn{background:var(--surface-2);border:0;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:17px;color:var(--ink);flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* week nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav .lbl{text-align:center;font-size:13px;color:var(--muted);flex:1}
.nav .lbl b{display:block;color:var(--ink);font-size:15px}
.day-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:2px 0 8px;display:flex;justify-content:space-between}
.day-h.today{color:var(--now)}
.days{display:flex;flex-direction:column;gap:16px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.mgrid .dn{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding:4px 0}
.mday{aspect-ratio:1/1.05;max-width:100%;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;gap:4px;font-variant-numeric:tabular-nums;font-size:14px;min-width:0}
.mday.out{color:var(--muted);opacity:.45}
.mday.wkend{color:var(--muted)}
.mday.today{outline:2px solid var(--now);outline-offset:-2px}
.mday.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:30px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(8,12,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 14px}
.sheet form{display:flex;flex-direction:column;gap:12px}

.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px}

.swatches span{display:block;width:30px;height:30px;border-radius:50%;background:var(--sc);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2.5px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.note{font-size:12.5px;color:var(--muted);line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <div class="avatar" id="avatar" aria-hidden="true">?</div>

<script>
/* ---------- Мій семестр ----------
   Автономна програма: без сервера, акаунтів і зовнішніх сервісів.
   Усі дані зберігаються лише в localStorage цього браузера під ключем "miy-semestr.v1".
   Перенести їх на інший пристрій можна файлом резервної копії (Профіль → Дані).
     custom    — пари: {subj, kind, teacher, room, day: 1–6 (пн–сб), pair: 1–7 або 0 (свій час: start, end), week: "both"|"chys"|"znam", skip: "never"|"always"|"chys"|"znam"}
     overrides — зміни до вбудованих пар DEFAULT_CLASSES (зараз порожній)
     settings  — {group, semStart, semEnd ("YYYY-MM-DD"), pairs: {"1":["08:30","09:50"], ...}, mode: "auto"|"chys"|"znam"|"off", flip, name, excluded}
     goals     — цілі: kind "steps" (кроки з датами) або "habit" (дні тижня days, start, end, журнал log {"YYYY-MM-DD": true})
     events, grades — події, оцінки */
const DEFAULT_PAIRS={1:["08:30","09:50"],2:["10:10","11:30"],3:["11:50","13:10"],4:["13:30","14:50"],5:["15:05","16:25"],6:["16:40","18:00"],7:["18:10","19:30"]};
function pairs(){return state.settings.pairs||DEFAULT_PAIRS;}
const DEFAULT_CLASSES=[];
const SEM_START="2026-09-01", SEM_END="2026-12-31";
const REF_MON=new Date(2026,9,19); // опорний тиждень = знаменник; якщо навпаки, кнопка «Поміняти»

/* ---------- текст ---------- */
const MON_G=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MON_N=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const DOW=["Неділя","Понеділок","Вівторок","Середа","Четвер","П’ятниця","Субота"];
const DOW_S=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const WK_LABEL={chys:"Чисельник",znam:"Знаменник",off:"Без поділу"};
const WK_MODES=[["auto","Чергувати"],["chys","Лише чисельник"],["znam","Лише знаменник"],["off","Вимкнути"]];
const MODE_NOTE={auto:"Чисельник і знаменник чергуються щотижня автоматично.",chys:"Щотижня показуються пари чисельника.",znam:"Щотижня показуються пари знаменника.",off:"Поділу немає: показуються всі пари, і з чисельника, і зі знаменника."};
const EV_KIND={module:{l:"Модуль",c:"mod",v:"--rose"},deadline:{l:"Дедлайн",c:"dl",v:"--accent"},personal:{l:"Особисте",c:"per",v:"--znam"}};
const GCOL={g1:"--accent",g2:"--znam",g3:"--now",g4:"--rose",g5:"--violet"};

/* ---------- стан ---------- */
const state={goalSec:"steps",profSec:null,custom:{},grades:{},statsOff:0,goals:{},events:{},overrides:{},settings:{flip:false},tab:"week",weekOff:0,monthCur:null,sel:null};
const LS="miy-semestr.v1";
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s){state.goals=s.goals||{};state.events=s.events||{};state.overrides=s.overrides||{};state.settings=s.settings||{flip:false};state.grades=s.grades||{};state.custom=s.custom||{};}const t=localStorage.getItem(LS+".tab");if(t)state.tab=t==="today"?"week":t;}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({goals:state.goals,events:state.events,overrides:state.overrides,settings:state.settings,grades:state.grades,custom:state.custom}));}catch(e){}}

/* ---------- дати ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekType(d){const m=state.settings.mode;if(m==="chys"||m==="znam"||m==="off")return m;const diff=Math.round((mondayOf(d)-REF_MON)/(7*864e5));let t=(((diff%2)+2)%2===0)?"znam":"chys";if(state.settings.flip)t=t==="znam"?"chys":"znam";return t;}
const fmtDay=d=>d.getDate()+" "+MON_G[d.getMonth()];
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m;};
function rel(dateStr){const n=Math.round((parse(dateStr)-today0())/864e5);if(n===0)return"сьогодні";if(n===1)return"завтра";if(n===-1)return"вчора";if(n<0)return Math.abs(n)+" дн. тому";return"через "+n+" дн.";}
function dur(min){const h=Math.floor(min/60),m=min%60;return(h?h+" год ":"")+m+" хв";}

/* ---------- дані ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function classes(){return DEFAULT_CLASSES.map(c=>Object.assign({skip:"never"},c,state.overrides[c.id]||{})).concat(Object.entries(state.custom).map(([id,c])=>Object.assign({skip:"never",week:"both",kind:""},c,{id,day:Number(c.day),pair:Number(c.pair),custom:true})));}
function ctime(c){const P=Number(c.pair)?pairs()[c.pair]:null;return P?[P[0],P[1]]:[c.start||"00:00",c.end||c.start||"00:00"];}
const pairLbl=c=>Number(c.pair)?c.pair+" пара":c.start;
function classesOn(d){const ds=ymd(d);if(ds<(state.settings.semStart||SEM_START)||ds>(state.settings.semEnd||SEM_END))return[];const day=(d.getDay()+6)%7+1;if(day>6)return[];const wt=weekType(d);
  return classes().filter(c=>c.day===day&&!c.hidden&&!isExcl(c.subj)&&(c.week==="both"||wt==="off"||c.week===wt)).map(c=>Object.assign({},c,{skipped:c.skip==="always"||c.skip===wt,start:ctime(c)[0],end:ctime(c)[1]})).sort((a,b)=>a.start.localeCompare(b.start)||a.pair-b.pair);}
function goalList(){return Object.entries(state.goals).map(([id,g])=>Object.assign({id},g)).sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999")||(a.created||0)-(b.created||0));}
const MAX_STEPS=30;
const isHabit=g=>!!g&&g.kind==="habit";
const dowN=d=>(d.getDay()+6)%7+1;
function habitDays(g){return Array.isArray(g.days)&&g.days.length?g.days.map(Number):[1,2,3,4,5];}
function habitOn(g,ds){if(!isHabit(g)||g.queued)return false;if(g.start&&ds<g.start)return false;if(g.end&&ds>g.end)return false;return habitDays(g).includes(dowN(parse(ds)));}
function habitStat(g,from,to){const ts=ymd(today0()),log=g.log||{};let t=0,d=0;
  for(let x=new Date(from);x<=to;x=addDays(x,1)){const ds=ymd(x);if(ds>ts)break;if(!habitOn(g,ds))continue;const done=!!log[ds];if(ds===ts&&!done)continue;t++;if(done)d++;}
  return{d,t,p:t?Math.round(d/t*100):null};}
function habitStats(g){const t=today0(),y=t.getFullYear(),m=t.getMonth(),mon=mondayOf(t);
  return{w:habitStat(g,mon,addDays(mon,6)),m:habitStat(g,new Date(y,m,1),new Date(y,m+1,0)),y:habitStat(g,new Date(y,0,1),new Date(y,11,31))};}
function daysLabel(g){const d=habitDays(g).slice().sort();const k=d.join("");
  return k==="12345"?"Щобудня":k==="1234567"?"Щодня":k==="67"?"Щовихідних":d.map(n=>DOW_S[n-1]).join(", ");}
function splitSteps(text,start,perDay,skipWk){const lines=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);let d=start?parse(start):null;
  return lines.map(t=>{let date="";if(d){if(perDay&&skipWk)while(d.getDay()%6===0)d=addDays(d,1);date=ymd(d);if(perDay)d=addDays(d,1);}return{id:uid(),text:t.slice(0,140),date,done:false};});}
function progress(g){if(isHabit(g)){const m=habitStats(g).m;return{d:m.d,t:0,p:m.p||0,habit:true};}const s=g.steps||[];const d=s.filter(x=>x.done).length;return{d,t:s.length,p:s.length?Math.round(d/s.length*100):0};}
function isDone(g){if(isHabit(g))return false;const p=progress(g);return !!(p.t&&p.d===p.t);}
function itemsOn(ds){const out=[];
  for(const[id,e]of Object.entries(state.events))if(e.date===ds)out.push({type:"event",id,e,sort:e.time||"00:00"});
  for(const g of goalList()){if(g.queued)continue;for(const s of g.steps||[])if(s.date===ds)out.push({type:"step",g,s,sort:"99:"+(s.done?1:0)});
    if(g.deadline===ds)out.push({type:"gdl",g,sort:"98"});
    if(habitOn(g,ds)){const done=!!(g.log||{})[ds];out.push({type:"habit",g,ds,done,sort:"97:"+(done?1:0)});}}
  return out.sort((a,b)=>a.sort.localeCompare(b.sort));}

/* ---------- рендер ---------- */
const $=id=>document.getElementById(id);
function render(){
  const t=today0();
  $("hdate").textContent=DOW[t.getDay()]+", "+fmtDay(t);
  const wt=weekType(t);const pill=$("wkpill");pill.className="wk "+wt;pill.textContent=WK_LABEL[wt];
  $("eyebrow").textContent=(state.settings.group?state.settings.group+" · ":"")+"Мій розклад";$("nameLbl").textContent=(state.settings.group?state.settings.group+" · ":"")+"Профіль";
  const prof=state.tab==="profile";$("hmain").hidden=prof;pill.hidden=prof;$("hname").hidden=!prof;
  if(prof){const ni=$("nameInput");if(document.activeElement!==ni)ni.value=state.settings.name||"";$("avatar").textContent=initials(ni.value);}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===state.tab?"page":"false"));
  const v=$("view");
  if(state.tab==="week")v.innerHTML=viewWeek();
  else if(state.tab==="goals")v.innerHTML=viewGoals();
  else if(state.tab==="month")v.innerHTML=viewMonth();
  else v.innerHTML=viewProfile();
  $("fab").hidden=state.tab==="profile";
  $("fab").textContent=state.tab==="goals"?"＋ Ціль":"＋ Подія";
  renderHero();
}

function heroData(){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes(),t=today0();
  const list=classesOn(t).filter(c=>!c.skipped);
  for(const c of list){const s=toMin(c.start),e=toMin(c.end);
    if(nm>=s&&nm<e)return{live:true,c,label:"Зараз · "+pairLbl(c),count:"до кінця "+dur(e-nm),p:Math.round((nm-s)/(e-s)*100)};
    if(nm<s)return{c,label:"Далі · "+pairLbl(c),count:"початок о "+c.start+" · через "+dur(s-nm)};}
  for(let i=1;i<10;i++){const d=addDays(t,i);const l=classesOn(d).filter(c=>!c.skipped);
    if(l.length)return{c:l[0],label:(i===1?"Завтра":DOW[d.getDay()])+" · перша пара",count:"о "+l[0].start+(list.length?" · на сьогодні пари закінчились":"")};}
  return null;
}
function renderHero(){const el=$("hero");if(!el)return;const h=heroData();
  if(!h){el.className="hero";el.innerHTML='<div class="state">Пар найближчим часом немає</div>';return;}
  el.className="hero"+(h.live?" live":"");
  el.innerHTML='<div class="state">'+esc(h.label)+'</div><div class="subj">'+esc(h.c.subj)+'</div><div class="meta">'+esc(h.c.kind)+' · ауд. '+esc(h.c.room)+(h.c.teacher?' · '+esc(h.c.teacher):'')+'</div>'+
  (h.live?'<div class="bar"><i style="width:'+h.p+'%"></i></div>':'')+'<div class="count">'+esc(h.count)+'</div>';}

function classRow(c,isToday){
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  const live=isToday&&!c.skipped&&nm>=toMin(c.start)&&nm<toMin(c.end);
  return '<button class="row'+(c.skipped?" skipped":"")+(live?" nowrow":"")+'" data-act="editClass" data-id="'+c.id+'">'+
  '<div class="time">'+c.start+'<span>'+c.end+'</span></div>'+
  '<div class="body"><div class="title">'+esc(c.subj)+'</div><div class="sub">ауд. '+esc(c.room)+(c.teacher?' · '+esc(c.teacher):'')+'</div>'+
  '<div class="chips"><span class="chip">'+esc(c.kind)+'</span>'+(c.week!=="both"?'<span class="chip">'+(c.week==="chys"?"чис.":"знам.")+'</span>':'')+(c.skipped?'<span class="chip skip">пропускаю</span>':'')+'</div></div>'+
  '<div class="pairno">'+(c.pair||"")+'</div></button>';}
function itemRow(it){
  if(it.type==="event"){const k=EV_KIND[it.e.kind]||EV_KIND.personal;
    return '<button class="row" data-act="editEvent" data-id="'+it.id+'"><div class="time">'+(it.e.time?esc(it.e.time):'<span>день</span>')+'</div>'+
    '<div class="body"><div class="title">'+esc(it.e.title)+'</div>'+(it.e.note?'<div class="sub">'+esc(it.e.note)+'</div>':'')+'<div class="chips"><span class="chip '+k.c+'">'+k.l+'</span></div></div><div></div></button>';}
  if(it.type==="habit"){const gc="var("+(GCOL[it.g.color]||"--accent")+")";const fut=it.ds>ymd(today0());
    return '<div class="row'+(it.done?" done":"")+'" style="--gc:'+gc+'"><div class="time"><span>звичка</span></div><div class="body"><div class="title">'+esc(it.g.title)+'</div><div class="sub" style="color:'+gc+'">'+daysLabel(it.g)+'</div></div>'+
    '<button class="check'+(it.done?" on":"")+'" data-act="toggleHabit" data-g="'+it.g.id+'" data-d="'+it.ds+'" aria-label="Виконано"'+(fut?' disabled':'')+'></button></div>';}
  if(it.type==="step"){const gc="var("+(GCOL[it.g.color]||"--accent")+")";
    return '<div class="row'+(it.s.done?" done":"")+'" style="--gc:'+gc+'"><div class="time"><span>крок</span></div><div class="body"><div class="title">'+esc(it.s.text)+'</div><div class="sub" style="color:'+gc+'">'+esc(it.g.title)+'</div></div>'+
    '<button class="check'+(it.s.done?" on":"")+'" data-act="toggleStep" data-g="'+it.g.id+'" data-s="'+it.s.id+'" aria-label="Виконано"></button></div>';}
  const gc="var("+(GCOL[it.g.color]||"--accent")+")";const pr=progress(it.g);
  return '<button class="row" style="--gc:'+gc+'" data-act="tab" data-tab="goals"><div class="time"><span>ціль</span></div><div class="body"><div class="title">Дедлайн: '+esc(it.g.title)+'</div><div class="sub">виконано '+pr.p+'%</div></div><div></div></button>';}
function dayAgenda(d){const ds=ymd(d),isT=ds===ymd(today0());const cl=classesOn(d),its=itemsOn(ds);
  if(!cl.length&&!its.length)return '<div class="agenda"><div class="empty">Вільний день. Пар і подій немає.</div></div>';
  return '<div class="agenda">'+cl.map(c=>classRow(c,isT)).join("")+its.map(itemRow).join("")+'</div>';}

function upcoming(days){const t=today0(),out=[];
  for(let i=1;i<=days;i++){const ds=ymd(addDays(t,i));for(const it of itemsOn(ds))if(!(it.type==="step"&&it.s.done))out.push(Object.assign({ds},it));}
  return out;}
function weekGoals(){const gl=goalList().filter(g=>{if(g.queued)return false;const p=progress(g);return !(p.t&&p.d===p.t);}).sort((a,b)=>progress(b).p-progress(a).p).slice(0,3);

    '<div class="hab-week">'+[0,1,2,3,4,5,6].map(i=>{const d=addDays(mon,i),ds=ymd(d);const on=habitOn(g,ds),done=!!log[ds],fut=ds>ts;

    '<div class="note" style="margin:0">Можна відмітити пропущений день цього тижня заднім числом: натисни на нього. Сьогоднішній день рахується, щойно його відмічено.</div></section>';};
  const card=g=>{if(isHabit(g))return hcard(g);const p=progress(g);const prev=g.after&&state.goals[g.after];const nexts=gl.filter(x=>x.queued&&x.after===g.id);const gc="var("+(GCOL[g.color]||"--accent")+")";

    (nexts.length?'<div class="note">Далі: '+nexts.map(x=>'«'+esc(x.title)+'»').join(", ")+'</div>':'')+
    '<div class="gbar"><i style="width:'+p.p+'%"></i></div><div class="stats"><span>'+p.d+' з '+p.t+' кроків'+(g.deadline?' · до '+fmtDay(parse(g.deadline))+' ('+rel(g.deadline)+')':'')+'</span><b>'+p.p+'%</b></div>'+
    '<div class="steps">'+(g.steps||[]).map(s=>'<div class="step'+(s.done?" done":"")+'"><button class="check'+(s.done?" on":"")+'" data-act="toggleStep" data-g="'+g.id+'" data-s="'+s.id+'" aria-label="Виконано"></button><span class="st">'+esc(s.text)+'</span>'+(s.date?'<span class="sd">'+parse(s.date).getDate()+'.'+pad(parse(s.date).getMonth()+1)+'</span>':'')+'<button class="link" data-act="editStep" data-g="'+g.id+'" data-s="'+s.id+'" aria-label="Змінити крок">⋯</button></div>').join("")+'</div>'+
    '<div class="shift"><span>'+((g.autoShift||g.pullAhead)?'Динамічний графік: пропущений крок переноситься на наступний день, а виконане наперед скорочує графік':'Динамічний графік')+'</span><button class="switch" role="switch" aria-checked="'+((g.autoShift||g.pullAhead)?"true":"false")+'" data-act="toggleDyn" data-id="'+g.id+'" aria-label="Динамічний графік"></button></div>'+

/* ---------- профіль ---------- */
const KIND_G={module:"Модуль",exam:"Екзамен",credit:"Залік",other:"Інше"};
const ECTS=n=>n>=90?"A":n>=82?"B":n>=75?"C":n>=67?"D":n>=60?"E":n>=35?"FX":"F";
const fmtN=n=>String(Math.round(Number(n)*10)/10).replace(".",",");
const pl=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14))?b:c;};
function gid(s){let h=5381;for(const ch of s)h=((h<<5)+h+ch.codePointAt(0))|0;return"s"+(h>>>0).toString(36);}
function subjects(){const out=[];for(const c of classes())if(!out.includes(c.subj))out.push(c.subj);
  for(const g of Object.values(state.grades))if(g&&g.subject&&!out.includes(g.subject))out.push(g.subject);return out;}
function gradeTotal(g){const val=v=>(v===undefined||v===null||v==="")?null:Number(v);const sem=val(g&&g.seminars),ex=val(g&&g.exam);
  const has=sem!==null||ex!==null;return{sem,ex,has,complete:sem!==null&&ex!==null,total:has?(sem||0)+(ex||0):null};}
function sumText(t){if(!t.has)return"Разом: —. Дві складові разом дають підсумок зі 100.";if(!isFinite(t.total))return"Разом: —. Введи бали числами.";
  return"Разом: "+fmtN(t.total)+" зі 100"+(t.complete?" · "+ECTS(t.total):" · поки без "+(t.ex===null?"екзамену/модуля":"семінарів"));}
function weekDone(mon){const days=[],idx={};for(let i=0;i<7;i++){const ds=ymd(addDays(mon,i));idx[ds]=i;days.push({ds,plan:0,done:0});}
  const per={};let pd=0;
  for(const g of goalList()){if(g.queued)continue;for(const s of g.steps||[]){
    if(s.date&&idx[s.date]!==undefined){days[idx[s.date]].plan++;if(s.done)pd++;}
    if(s.done){const dd=s.doneAt||s.date;if(dd&&idx[dd]!==undefined){days[idx[dd]].done++;per[g.id]=(per[g.id]||0)+1;}}}
    if(isHabit(g))for(const x of days)if(habitOn(g,x.ds)){x.plan++;if((g.log||{})[x.ds]){x.done++;pd++;per[g.id]=(per[g.id]||0)+1;}}}
  return{days,per,pd};}
function streak(){const set=new Set();for(const g of goalList()){for(const s of g.steps||[])if(s.done&&(s.doneAt||s.date))set.add(s.doneAt||s.date);for(const[k,v]of Object.entries(g.log||{}))if(v)set.add(k);}
  let d=today0();if(!set.has(ymd(d)))d=addDays(d,-1);let n=0;while(set.has(ymd(d))&&n<1000){n++;d=addDays(d,-1);}return n;}

function viewProfile(){const mon=addDays(mondayOf(today0()),state.statsOff*7);const W=weekDone(mon);const days=W.days;
  const totalDone=days.reduce((a,x)=>a+x.done,0),totalPlan=days.reduce((a,x)=>a+x.plan,0);
  const all=goalList();const achieved=all.filter(g=>{const p=progress(g);return p.t&&p.d===p.t;}).sort((a,b)=>(b.completedAt||"").localeCompare(a.completedAt||""));
  const thisWeek=weekDone(mondayOf(today0())).days.reduce((a,x)=>a+x.done,0);const st=streak();
  let h='<section class="stats3"><div class="stat"><b>'+achieved.length+'</b><span>'+pl(achieved.length,"ціль досягнута","цілі досягнуто","цілей досягнуто")+'</span></div>'+

    '<div class="legend"><span><i style="background:var(--accent)"></i>виконано</span><span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)"></i>заплановано</span><span>разом '+totalDone+' з '+totalPlan+'</span></div>';
  const pg=all.filter(g=>W.per[g.id]);
  if(pg.length)h+='<div class="agenda" style="margin-top:12px">'+pg.map(g=>'<div class="grow"><div class="body"><div class="title" style="color:var('+(GCOL[g.color]||"--accent")+')">'+esc(g.title)+'</div></div><div class="grade">'+W.per[g.id]+'</div></div>').join("")+'</div>';
  h+='</section>';
  const hAch='<section><h2>Досягнуті цілі<small>'+achieved.length+'</small></h2><div class="agenda">'+(achieved.length?achieved.map(g=>'<div class="grow" style="--gc:var('+(GCOL[g.color]||"--accent")+')"><div class="body"><div class="title">'+esc(g.title)+'</div><div class="sub">'+(g.steps||[]).length+' '+pl((g.steps||[]).length,"крок","кроки","кроків")+(g.completedAt?' · виконано '+fmtDay(parse(g.completedAt)):'')+'</div></div><span class="ach-act"><button class="icon-btn" data-act="editGoal" data-id="'+g.id+'" aria-label="Редагувати ціль">✎</button><button class="check on" data-act="reopenGoal" data-g="'+g.id+'" aria-label="Повернути в цілі"></button></span></div>').join("")+'<div class="empty" style="padding:10px 14px;text-align:left">Зніми галочку, щоб повернути ціль у «Цілі».</div>':'<div class="empty">Тут з’являться цілі, які ти виконаєш повністю.</div>')+'</div></section>';
  const subs=subjects().filter(x=>!isExcl(x)||gradeTotal(state.grades[gid(x)]).has);const tots=subs.map(s=>gradeTotal(state.grades[gid(s)]));const withT=tots.filter(t=>t.has);

      return '<button class="grow" data-act="gradeOpen" data-s="'+esc(s)+'"><div class="body"><div class="title">'+esc(s)+'</div><div class="sub">'+parts+'</div></div><div class="grade">'+(t.has?fmtN(t.total):'—')+(t.complete?'<span class="ects '+ECTS(t.total)+'">'+ECTS(t.total)+'</span>':'')+'</div></button>';}).join("")+
    '<div class="grow avg-row"><div class="body"><div class="title">Середній бал</div><div class="sub">'+(withT.length?'середнє арифметичне по '+withT.length+' '+pl(withT.length,"предмету","предметах","предметах"):'з’явиться після першої оцінки')+'</div></div><div class="grade">'+(avg!==null?fmtN(avg):'—')+(avg!==null&&withT.every(t=>t.complete)?'<span class="ects '+ECTS(avg)+'">'+ECTS(avg)+'</span>':'')+'</div></div></div>'+
    '<div class="scale">Шкала ECTS: A 90–100 · B 82–89 · C 75–81 · D 67–74 · E 60–66 · FX 35–59 · F 0–34. Літера з’являється, коли внесено обидві складові.</div></section>';

/* ---------- розклад у профілі: налаштування, пари, виключення ---------- */
function isExcl(subj){const ex=state.settings.excluded;return Array.isArray(ex)&&ex.length>0&&ex.includes(nrm(subj));}
const nrm=x=>String(x||"").toLowerCase().replace(/[\s.,'’ʼ"«»-]+/g," ").trim();
function schedSettings(){const m=state.settings.mode||"auto";
  let h='<section><h2>Розклад</h2><div class="actions"><button class="btn" data-act="addClass">＋ Додати пару/урок</button><button class="btn ghost" data-act="setup">Група, семестр, час пар/уроків</button></div>'+

function pairsList(){const all=classes().filter(c=>!c.hidden);

    h+='<div><div class="day-h"><span>'+DOW[d%7]+'</span></div><div class="agenda">'+cs.map(c=>{const P=ctime(c);const ex=isExcl(c.subj);

  '<div class="actions"><button class="btn" type="submit">Зберегти</button><button class="btn ghost" type="button" data-act="close">Скасувати</button></div></form>',
  f=>{const pr={};for(const k of Object.keys(DEFAULT_PAIRS)){const a=fv(f,"ps"+k),b=fv(f,"pe"+k);if(!a||!b||a>=b){toast("Перевір час "+k+" пари: початок має бути раніше за кінець");return;}pr[k]=[a,b];}
    if(fv(f,"semStart")>fv(f,"semEnd")){toast("Початок семестру має бути раніше за кінець");return;}
    const ns=Object.assign({},state.settings,{group:fv(f,"group"),semStart:fv(f,"semStart"),semEnd:fv(f,"semEnd"),pairs:pr});closeSheet();state.settings=ns;save();toast("Налаштування збережено");});}

/* ---------- резервна копія ---------- */
function profileData(){
  return '<section><h2>Дані</h2><p class="note" style="margin:0 0 12px">Усе зберігається лише в цьому браузері й нікуди не надсилається. Збережи копію у файл, щоб перенести дані на інший пристрій або не втратити їх, якщо очистиш браузер.</p>'+
    '<div class="actions"><button class="btn ghost" data-act="backup">Зберегти копію</button><button class="btn ghost" data-act="restore">Відновити з копії</button></div></section>';}
function backup(){const data={app:"miy-semestr",v:1,saved:new Date().toISOString(),settings:state.settings,custom:state.custom,overrides:state.overrides,goals:state.goals,events:state.events,grades:state.grades};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));a.download="miy-semestr-"+ymd(today0())+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Копію збережено у файл "+a.download);}
function restoreAsk(txt){let d=null;try{d=JSON.parse(txt);}catch(e){}
  if(!d||d.app!=="miy-semestr"){toast("Це не файл копії «Мого семестру»");return;}
  const sd=new Date(d.saved),when=isNaN(sd)?"":fmtDay(sd)+" "+sd.getFullYear();
  openSheet('<h3>Відновити з копії</h3><form><p class="note" style="margin:0">'+(when?'Копія від '+esc(when)+'. ':'')+'Пари, цілі, події, оцінки й налаштування в цьому браузері буде замінено даними з файлу.</p>'+
    '<div class="actions"><button class="btn" type="submit">Відновити</button><button class="btn ghost" type="button" data-act="close">Скасувати</button></div></form>',
  ()=>{const o=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};
    state.settings=Object.assign({flip:false},o(d.settings));state.custom=o(d.custom);state.overrides=o(d.overrides);state.goals=o(d.goals);state.events=o(d.events);state.grades=o(d.grades);
    closeSheet();save();applyShifts();toast("Дані відновлено");});}

/* ---------- автозсув графіка ---------- */
/* підтягування: невиконані майбутні кроки займають найраніші майбутні дати графіка, виконані наперед кроки отримують сьогоднішню дату */
function compact(g){const ts=ymd(today0());const steps=(g.steps||[]).map(s=>Object.assign({},s));
  const fut=steps.filter(s=>s.date&&s.date>ts);const D=fut.filter(s=>s.done);if(!D.length)return null;
  const U=fut.filter(s=>!s.done).sort((a,b)=>a.date.localeCompare(b.date));
  const oldLast=U.length?U[U.length-1].date:null;const slots=fut.map(s=>s.date).sort();
  U.forEach((s,i)=>{s.date=slots[i];});D.forEach(s=>{s.date=ts;});
  const newLast=U.length?U[U.length-1].date:null;
  const ng=Object.assign({},g,{steps});delete ng.id;
  return{ng,gain:oldLast?Math.round((parse(oldLast)-parse(newLast))/864e5):0};}
const shiftDone=new Set();
function applyShifts(){const t=today0(),ts=ymd(t);
  for(const g of goalList()){if(!g.autoShift||g.queued)continue;
    const und=(g.steps||[]).filter(s=>!s.done&&s.date);if(!und.length)continue;
    const min=und.reduce((a,s)=>s.date<a?s.date:a,und[0].date);if(min>=ts)continue;
    const key=g.id+":"+min+":"+ts;if(shiftDone.has(key))continue;shiftDone.add(key);
    const delta=Math.round((t-parse(min))/864e5);
    const steps=(g.steps||[]).map(s=>(!s.done&&s.date)?Object.assign({},s,{date:ymd(addDays(parse(s.date),delta))}):s);
    const ng=Object.assign({},g,{steps});delete ng.id;
    if(ng.deadline)ng.deadline=ymd(addDays(parse(ng.deadline),delta));
    state.goals[g.id]=ng;save();
    toast("Графік «"+ng.title+"» зсунуто на "+delta+" дн.");}
  for(const g of goalList()){if(!g.pullAhead||g.queued)continue;const r=compact(g);if(!r)continue;
    state.goals[g.id]=r.ng;save();if(r.gain>0)toast("Графік «"+r.ng.title+"» підтягнуто на "+r.gain+" дн.");}}

/* ---------- черга цілей ---------- */
function activateNext(gid){const start=addDays(today0(),1);let first="";
  for(const[k,x]of Object.entries(state.goals)){if(!x.queued||x.after!==gid)continue;
    let steps=(x.steps||[]).map(s=>Object.assign({},s));let deadline=x.deadline||"";
    if(x.perDay){let i=0;steps=steps.map(s=>s.done?s:Object.assign(s,{date:ymd(addDays(start,i++))}));if(i)deadline=ymd(addDays(start,i-1));}
    else{const dated=steps.filter(s=>!s.done&&s.date);
      if(dated.length){const min=dated.reduce((a,s)=>s.date<a?s.date:a,dated[0].date);const delta=Math.round((start-parse(min))/864e5);
        steps=steps.map(s=>(!s.done&&s.date)?Object.assign(s,{date:ymd(addDays(parse(s.date),delta))}):s);
        if(deadline)deadline=ymd(addDays(parse(deadline),delta));}}
    const nx=Object.assign({},x,{queued:false,steps,deadline,started:ymd(today0())});if(isHabit(x)){nx.start=ymd(start);nx.deadline="";}state.goals[k]=nx;save();first=first||x.title;}
  return first;}

/* ---------- дії ---------- */
const ACT={
  tab:d=>{state.tab=d.tab;if(d.tab==="profile")state.profSec=null;try{localStorage.setItem(LS+".tab",d.tab);}catch(e){}render();window.scrollTo(0,0);},
  wk:d=>{state.weekOff=d.d==="0"?0:state.weekOff+Number(d.d);render();},
  mon:d=>{const m=state.monthCur;state.monthCur=new Date(m.getFullYear(),m.getMonth()+Number(d.d),1);render();},
  selDay:d=>{state.sel=d.d;render();},
  fab:()=>{if(state.tab==="goals")goalForm(null,null,state.goalSec);else eventForm(null,state.tab==="month"?state.sel:null);},
  close:closeSheet,
  editGoal:d=>goalForm(d.id),
  addStep:d=>stepForm(d.g),
  goalSec:d=>{state.goalSec=d.s;render();},
  addClass:()=>classForm(null),
  profSec:d=>{state.profSec=d.s||null;render();window.scrollTo(0,0);},
  resetSched:()=>openSheet('<h3>Скинути налаштування розкладу?</h3><p class="note" style="margin:0 0 14px">Повернуться типові значення: група, дати семестру, час пар, чергування чисельника й знаменника, і всі предмети знову з’являться в розкладі. Пари, цілі, події й оцінки залишаться.</p><div class="actions"><button class="btn danger" data-act="resetSchedDo">Скинути</button><button class="btn ghost" data-act="close">Скасувати</button></div>',null),
  resetPairs:()=>{const n=classes().filter(x=>!x.hidden).length;if(!n){toast("Пар ще немає");return;}openSheet('<h3>Скинути розклад пар?</h3><p class="note" style="margin:0 0 14px">Буде видалено всі '+n+' '+pl(n,"пару","пари","пар")+'. Після цього розклад можна додати заново в розділі «Розклад». Налаштування, цілі, події й оцінки залишаться.</p><div class="actions"><button class="btn danger" data-act="resetPairsDo">Видалити всі пари</button><button class="btn ghost" data-act="close">Скасувати</button></div>',null);},
  resetPairsDo:()=>{state.custom={};state.overrides={};closeSheet();save();toast("Розклад пар скинуто");},
  resetSchedDo:()=>{const ns={flip:false};if(state.settings.name)ns.name=state.settings.name;state.settings=ns;closeSheet();save();toast("Налаштування розкладу скинуто");},
  toggleSubj:d=>{const k=nrm(d.s);const ex=Array.isArray(state.settings.excluded)?state.settings.excluded.slice():[];const i=ex.indexOf(k);if(i>=0)ex.splice(i,1);else ex.push(k);
    state.settings=Object.assign({},state.settings,{excluded:ex});save();toast(i>=0?"«"+d.s+"» знову в розкладі":"«"+d.s+"» сховано з розкладу");},
  backup:backup,
  restore:()=>{const i=$("restoreFile");i.value="";i.click();},
  setup:setupForm,
  delClass:d=>{delete state.custom[d.id];closeSheet();save();toast("Пару видалено");},
  statsWk:d=>{state.statsOff=d.d==="0"?0:state.statsOff+Number(d.d);render();},
  gradeOpen:d=>gradeSheet(d.s),
  delGrade:d=>{const id=gid(d.s);const cur=state.grades[id];if(!cur)return;const ng=Object.assign({},cur,{items:(cur.items||[]).filter(i=>i.id!==d.i)});state.grades[id]=ng;save();gradeSheet(d.s);},
  addNext:d=>goalForm(null,d.g),
  editStep:d=>stepForm(d.g,d.s),
  editEvent:d=>eventForm(d.id),
  editClass:d=>classForm(d.id),
  reopenGoal:d=>{const g=state.goals[d.g];if(!g)return;const st=(g.steps||[]).slice();let k=-1;st.forEach((x,i)=>{if(x.done&&(k<0||(x.doneAt||"")>=(st[k].doneAt||"")))k=i;});if(k<0)return;
    st[k]=Object.assign({},st[k],{done:false,doneAt:""});const ng=Object.assign({},g,{steps:st,completedAt:""});delete ng.id;state.goals[d.g]=ng;save();toast("«"+ng.title+"» повернуто в «Цілі»: крок «"+st[k].text+"» знову не виконаний");},
  toggleStep:d=>{const g=state.goals[d.g];if(!g)return;const steps=(g.steps||[]).map(x=>x.id===d.s?Object.assign({},x,{done:!x.done,doneAt:!x.done?ymd(today0()):""}):x);let ng=Object.assign({},g,{steps});
    if(ng.pullAhead){const r=compact(ng);if(r){ng=r.ng;if(r.gain>0)toast("Графік «"+ng.title+"» підтягнуто на "+r.gain+" дн.");}}
    state.goals[d.g]=ng;
    const p=progress(ng);ng.completedAt=(p.t&&p.d===p.t)?(g.completedAt||ymd(today0())):"";state.goals[d.g]=ng;save();
    if(p.t&&p.d===p.t&&!ng.queued){const n=activateNext(d.g);toast("Ціль «"+ng.title+"» досягнута і перенесена в «Досягнуті цілі»"+(n?". Далі: «"+n+"»":""));}},
  toggleHabit:d=>{const g=state.goals[d.g];if(!g||!isHabit(g))return;if(d.d>ymd(today0())){toast("Цей день ще не настав");return;}
    const log=Object.assign({},g.log||{});if(log[d.d])delete log[d.d];else log[d.d]=true;const ng=Object.assign({},g,{log});delete ng.id;state.goals[d.g]=ng;save();
    if(log[d.d]){const st=habitStats(ng);toast("Відмічено. Цей тиждень: "+(st.w.p===null?"—":st.w.p+"%"));}},
  toggleDyn:d=>{const g=state.goals[d.id];if(!g)return;const on=!(g.autoShift||g.pullAhead);const ng=Object.assign({},g,{autoShift:on,pullAhead:on});state.goals[d.id]=ng;
    save();if(on){toast("Динамічний графік увімкнено");applyShifts();}else toast("Динамічний графік вимкнено");},
  toggleShift:d=>{const g=state.goals[d.id];if(!g)return;const ng=Object.assign({},g,{autoShift:!g.autoShift});state.goals[d.id]=ng;
    save();if(ng.autoShift){toast("Автозсув увімкнено");applyShifts();}else toast("Автозсув вимкнено");},
  togglePull:d=>{const g=state.goals[d.id];if(!g)return;const ng=Object.assign({},g,{pullAhead:!g.pullAhead});state.goals[d.id]=ng;
    save();if(ng.pullAhead){toast("Підтягування увімкнено");applyShifts();}else toast("Підтягування вимкнено");},
  delGoal:d=>{const dg=state.goals[d.id];closeSheet();
    if(dg&&!dg.queued)activateNext(d.id);
    else for(const[k,x]of Object.entries(state.goals))if(x.queued&&x.after===d.id){const nx=Object.assign({},x,{after:dg?dg.after:""});state.goals[k]=nx;save();}
    delete state.goals[d.id];save();toast("Ціль видалено");},
  delStep:d=>{const g=state.goals[d.g];const ng=Object.assign({},g,{steps:(g.steps||[]).filter(x=>x.id!==d.s)});state.goals[d.g]=ng;closeSheet();save();},
  delEvent:d=>{delete state.events[d.id];closeSheet();save();toast("Подію видалено");},
  resetClass:d=>{delete state.overrides[d.id];closeSheet();save();},
  wkMode:d=>{state.settings=Object.assign({},state.settings,{mode:d.m});save();toast(d.m==="off"?"Поділ на чисельник і знаменник вимкнено":d.m==="auto"?"Тижні чергуються":"Щотижня: "+WK_LABEL[d.m].toLowerCase());},
  flip:()=>{state.settings=Object.assign({},state.settings,{flip:!state.settings.flip});save();toast("Тепер цей тиждень: "+WK_LABEL[weekType(today0())].toLowerCase());}
};
document.addEventListener("click",e=>{if(e.target===$("backdrop")){closeSheet();return;}const a=e.target.closest("[data-act]");if(!a)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a.dataset);}});
document.addEventListener("submit",e=>{e.preventDefault();if(sheetSubmit)sheetSubmit(e.target);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("backdrop").hidden)closeSheet();});
let lastDay=ymd(today0());
function tick(){const d=ymd(today0());if(d!==lastDay){lastDay=d;applyShifts();if($("backdrop").hidden)render();}else if(state.tab==="week"&&$("backdrop").hidden){renderHero();}}
setInterval(tick,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});

/* ---------- старт ---------- */
function initials(n){const w=String(n||"").trim().split(/\s+/).filter(Boolean);return w.length?w.slice(0,2).map(x=>x[0].toUpperCase()).join(""):"?";}
$("nameInput").addEventListener("input",e=>{$("avatar").textContent=initials(e.target.value);});
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur();});
$("nameInput").addEventListener("change",e=>{const v=e.target.value.trim();if(v===(state.settings.name||""))return;
  state.settings=Object.assign({},state.settings,{name:v});save();toast(v?"Ім’я збережено":"Ім’я видалено");});
$("restoreFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)f.text().then(restoreAsk,()=>toast("Не вдалося прочитати файл"));});
loadLocal();render();applyShifts();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
